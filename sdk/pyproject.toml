[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentscope-sdk"
version = "0.1.0"
description = "AgentScope Python SDK for Multi-Agent Observability"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.23.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
# LangGraph adapter path (Flow 1); the decorator/patch path needs only the base deps
langgraph = [
    "langchain-core>=0.3.0",
    "typing_extensions>=4.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentscope*"]

[tool.setuptools.package-data]
agentscope = ["benchmarks/README.md"]
