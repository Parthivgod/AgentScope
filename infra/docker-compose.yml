version: '3.8'

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  backend:
    build: 
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - AGENTSCOPE_API_KEY=${AGENTSCOPE_API_KEY:-test-key}
    depends_on:
      - redis

  worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "8443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Local self-signed cert for TLS termination (NFR 9.3). Generate with:
      #   openssl req -x509 -nodes -newkey rsa:2048 -days 365 \
      #     -keyout nginx/certs/server.key -out nginx/certs/server.crt \
      #     -subj "//CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
      - ./nginx/certs/server.crt:/etc/nginx/certs/server.crt:ro
      - ./nginx/certs/server.key:/etc/nginx/certs/server.key:ro
    depends_on:
      - backend

volumes:
  redis_data:
