name: AgentScope CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-python:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      REDIS_URL: redis://127.0.0.1:6379/15
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e "./sdk[langgraph,dev]"
        pip install -r backend/requirements.txt -r worker/requirements.txt
        pip install -r examples/support_triage_demo/requirements.txt
        pip install openai websockets
        
    - name: Run SDK Tests
      run: |
        python -m pytest sdk/tests/ -q
        
    - name: Run Backend Tests
      run: |
        cd backend
        python -m pytest tests -q

    - name: Run Worker Tests
      run: python -m pytest worker/tests -q

    - name: Run Demo Regression Tests
      run: |
        python -m pytest examples/custom_demo_agent/test_demo_e2e.py -q
        python -m pytest examples/langgraph_demo_agent/test_demo_e2e.py -q
        python -m pytest examples/support_triage_demo/test_support_demo.py -q

  smoke-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      REDIS_URL: redis://127.0.0.1:6379/14
      AGENTSCOPE_API_KEY: smoke-test-key
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt -r worker/requirements.txt
        pip install websockets
        pip install -e ./sdk
        
    - name: Run E2E Smoke Test
      run: |
        python scripts/smoke-test.py


  test-dashboard:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'

    - name: Install dashboard dependencies
      working-directory: dashboard
      run: npm ci

    - name: Production build
      working-directory: dashboard
      run: npm run build

    - name: Lint dashboard
      working-directory: dashboard
      run: npm run lint
